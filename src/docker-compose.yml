version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: src/Dockerfile

    container_name: express_app

    restart: always

    ports:
      - "3000:3000"

    volumes:
      - ../:/app
      - /app/node_modules

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: shopdb

    networks:
      - app-network

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile

    container_name: postgres_db

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: shopdb

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql

    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4

    container_name: pgadmin

    restart: always

    ports:
      - "5050:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_logs:
  pgadmin_data: